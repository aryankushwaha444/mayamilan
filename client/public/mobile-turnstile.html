<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="same-origin" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        font-src 'self' data:;
        connect-src 'self' https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        frame-src https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        child-src https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        worker-src 'self' blob: https://challenges.cloudflare.com https://*.challenges.cloudflare.com;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
      "
    />

    <title>Maya Milan Verification</title>

    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .wrap {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      #widget {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      #status {
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        text-align: center;
      }

      #status.error {
        color: #b91c1c;
      }

      #status.success {
        color: #15803d;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div id="widget"></div>
      <div id="status">Initializing verification…</div>
    </div>

    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var done = false;
        var timeoutMs = 30000;
        var timer = null;

        function readNonce() {
          try {
            var hash = String(window.location.hash || "").replace(/^#/, "");
            var parts = hash.split("&");

            for (var i = 0; i < parts.length; i++) {
              var kv = parts[i].split("=");
              var key = decodeURIComponent(kv[0] || "");
              var value = decodeURIComponent(kv[1] || "");

              if (key === "tn") return value;
            }
          } catch (e) {}

          return "";
        }

        function readSitekey() {
          try {
            var params = new URLSearchParams(window.location.search);
            return String(params.get("sitekey") || "").trim();
          } catch (e) {
            return "";
          }
        }

        var sitekey = readSitekey();
        var nonce = readNonce();

        function send(payload) {
          try {
            if (
              window.ReactNativeWebView &&
              typeof window.ReactNativeWebView.postMessage === "function"
            ) {
              window.ReactNativeWebView.postMessage(JSON.stringify(payload));
            }
          } catch (e) {}

          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, window.location.origin);
            }
          } catch (e) {}
        }

        function setStatus(text, kind) {
          if (!statusEl) return;
          statusEl.textContent = text;
          statusEl.className = kind || "";
        }

        function fail(error, code) {
          if (done) return;
          done = true;

          if (timer) clearTimeout(timer);

          send({
            type: "turnstile-error",
            error: String(error || "Turnstile verification failed"),
            code: code ? String(code) : undefined,
            nonce: nonce,
            origin: window.location.origin,
          });

          setStatus("Verification failed. Please retry.", "error");
        }

        if (!sitekey) {
          fail("Missing Turnstile sitekey", "missing-sitekey");
          return;
        }

        timer = setTimeout(function () {
          fail("Turnstile timed out", "timeout");
        }, timeoutMs);

        window.onTurnstileLoad = function () {
          try {
            if (
              !window.turnstile ||
              typeof window.turnstile.render !== "function"
            ) {
              fail("Turnstile API unavailable", "api-unavailable");
              return;
            }

            window.turnstile.render("#widget", {
              sitekey: sitekey,
              appearance: "always",
              execution: "render",
              theme: "light",
              size: "normal",

              callback: function (token) {
                if (done) return;
                done = true;

                if (timer) clearTimeout(timer);

                send({
                  type: "turnstile-token",
                  token: token,
                  nonce: nonce,
                  origin: window.location.origin,
                });

                setStatus("Verified.", "success");
              },

              "error-callback": function (code) {
                fail("Turnstile failed", code);
              },

              "expired-callback": function () {
                if (done) return;

                send({
                  type: "turnstile-error",
                  error: "Turnstile expired",
                  code: "expired",
                  nonce: nonce,
                  origin: window.location.origin,
                });

                setStatus("Verification expired. Please retry.", "error");
              },
            });

            send({
              type: "turnstile-ready",
              nonce: nonce,
              origin: window.location.origin,
            });
          } catch (e) {
            fail("Turnstile render failed", "render-failed");
          }
        };

        var script = document.createElement("script");
        script.src =
          "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit";
        script.async = true;
        script.defer = true;

        script.onerror = function () {
          fail("Turnstile script failed to load", "script-load-failed");
        };

        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
